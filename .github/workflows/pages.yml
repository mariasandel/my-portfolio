# Publishes the mid-fi mobile prototype to GitHub Pages on every push to main.
# The prototype is a single self-contained HTML file, so there is no build step:
# it is copied to index.html and deployed as is.
name: Deploy prototype to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "03 Develop/03_Prototype_Mobile-Mid-Fi.html"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare site
        run: |
          mkdir _site
          cp "03 Develop/03_Prototype_Mobile-Mid-Fi.html" _site/index.html
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
